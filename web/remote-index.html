<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; frame-src 'self' blob:; base-uri 'none'; form-action 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pi</title>
    <meta name="apple-mobile-web-app-title" content="Pi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      body {
        margin: 0;
        font: 15px/1.7 system-ui;
        background: var(--body-bg, #fff);
        color: var(--text, #242424);
      }
      #remote-status {
        display: grid;
        place-content: center;
        min-height: 90dvh;
        padding: 30px;
        text-align: center;
        box-sizing: border-box;
      }
      #remote-status h1 {
        font-size: 28px;
        font-weight: 600;
      }
      #remote-status p {
        color: var(--text-soft, #52525b);
        max-width: 380px;
      }
      #remote-status[hidden] {
        display: none;
      }
      .failed p {
        color: #ad4040;
      }
    </style>
  </head>
  <body>
    <main id="remote-status">
      <h1>Pi</h1>
      <p>Preparing a secure connection…</p>
    </main>
    <div id="spa-root"></div>
    <script type="module" src="/src/remote-entry.js"></script>
  </body>
</html>
