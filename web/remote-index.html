<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=contain"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; frame-src 'self' blob:; base-uri 'none'; form-action 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>YuGo Pi</title>
    <meta name="apple-mobile-web-app-title" content="YuGo Pi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#171a21" />
    <style>
      body {
        margin: 0;
        font: 15px/1.7 system-ui;
        background: var(--body-bg, #fff);
        color: var(--text, #242424);
      }
      #remote-status {
        display: grid;
        place-content: center;
        min-height: 90dvh;
        padding: 30px;
        text-align: center;
        box-sizing: border-box;
      }
      #remote-status:has(+ #spa-root:not(:empty)) {
        display: none;
      }
      .yugo-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: var(--body-bg, #f6f7fa);
        color: var(--text, #1f2937);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) .yugo-boot {
          background: #171a21;
          color: #edf1f7;
        }
      }
      .yugo-boot strong {
        font-size: 24px;
        font-weight: 640;
        letter-spacing: -0.04em;
      }
      .yugo-boot i {
        width: 27px;
        height: 3px;
        border-radius: 4px;
        background: currentColor;
        opacity: 0.45;
      }
      @media (prefers-reduced-motion: no-preference) {
        .yugo-boot i {
          animation: yugo-start 1s ease-in-out infinite alternate;
        }
      }
      @keyframes yugo-start {
        from {
          transform: scaleX(0.4);
          opacity: 0.28;
        }
        to {
          transform: scaleX(1.5);
          opacity: 0.8;
        }
      }
      #remote-status p {
        color: var(--text-soft, #52525b);
        max-width: 380px;
      }
      .failed p {
        color: #ad4040;
      }
    </style>
  </head>
  <body>
    <main id="remote-status">
      <div class="yugo-boot" role="status">
        <img src="/icon.svg" width="64" height="64" alt="" />
        <strong>YuGo Pi</strong><i aria-hidden="true"></i>
      </div>
    </main>
    <div id="spa-root"></div>
    <script type="module" src="/src/remote-entry.js"></script>
  </body>
</html>
