name: YuGo Apps

# YuGo Pi desktop and mobile apps. Nothing here needs a paid signing
# identity: macOS builds are ad-hoc signed, Windows builds are unsigned and the
# Android APK is signed with the project's own keystore (repository secrets).
# The separate iOS workflow builds the simulator target. Device distribution
# uses the signed app, and the browser client can be added to the Home Screen.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hosts:
    name: Unified desktop installers
    uses: ./.github/workflows/host-apps.yml

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$(node -p 'require("../../package.json").version')"
          export YUGO_VERSION="$version"
          # 0.1.0-yugo.38 -> 38; monotonically increasing across releases.
          export YUGO_VERSION_CODE="$(echo "$version" | sed -E 's/.*yugo\.([0-9]+)$/\1/')"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway debug key."
          fi
          gradle --no-daemon testDebugUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/yugo-pi-client-$version-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: yugo-app-android
          if-no-files-found: error
          path: apps/android/dist/*.apk
