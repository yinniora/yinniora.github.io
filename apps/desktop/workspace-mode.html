<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>YuGo Pi</title>
<style>
  :root {
    color-scheme: light dark;
    color: #18212b;
    background: #f5f7fb;
    font: 16px/1.55 system-ui, sans-serif;
    --card: #fff;
    --line: #d5deeb;
    --accent: #2856b6;
    --muted: #4f5e71;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color: #f0f3f8;
      background: #161b24;
      --card: #202732;
      --line: #414e60;
      --accent: #a6c3ff;
      --muted: #bac5d4;
    }
  }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 34rem; width: 100%; box-sizing: border-box; padding: 2rem; }
  h1 { margin: 0 0 0.55rem; font-size: clamp(1.65rem, 4vw, 2.15rem); line-height: 1.2; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  button {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    gap: 0.85rem;
    align-items: center;
    width: 100%;
    padding: 1rem;
    margin: 0.65rem 0;
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    background: var(--card);
    color: inherit;
    text-align: start;
    font: inherit;
    cursor: pointer;
    transition: border-color 150ms, transform 150ms;
  }
  button:hover, button:focus-visible { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { cursor: wait; }
  svg { width: 1.45rem; justify-self: center; color: var(--accent); }
  strong, small { display: block; }
  small, #hint { color: var(--muted); font-size: 0.875rem; }
  #hint { margin-top: 1.15rem; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
<main>
  <h1 id="title">Choose how to use YuGo Pi</h1>
  <p id="intro">You can change the desktop mode later in Settings.</p>
  <button type="button" data-mode="local">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
    <span><strong id="local-title">Run Pi on this computer</strong><small id="local-hint">Open local projects and pair other devices to work remotely.</small></span>
  </button>
  <button type="button" data-mode="remote">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2m6 0h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
    <span><strong id="remote-title">Connect to another computer</strong><small id="remote-hint">Open the workspace on a computer you have paired.</small></span>
  </button>
  <p id="error" role="alert" hidden>Could not save this choice. Try again.</p>
</main>
<script>
  const chinese = navigator.language.toLowerCase().startsWith('zh');
  if (chinese) {
    document.documentElement.lang = 'zh';
    const labels = {
      title: '选择如何使用 YuGo Pi',
      intro: '之后可在设置中切换桌面模式。',
      'local-title': '在这台电脑运行 Pi',
      'local-hint': '打开本机项目，也可配对其他设备远程使用。',
      'remote-title': '连接另一台电脑',
      'remote-hint': '配对另一台电脑，打开它的工作区。',
      error: '暂时无法保存选择，请重试。',
    };
    for (const [id, label] of Object.entries(labels)) document.getElementById(id).textContent = label;
  }
  const buttons = document.querySelectorAll('button[data-mode]');
  for (const button of buttons) {
    button.addEventListener('click', async () => {
      for (const item of buttons) item.disabled = true;
      document.getElementById('error').hidden = true;
      try {
        const mode = button.dataset.mode;
        if (window.__YUGOPI_CHOOSE_MODE__) await window.__YUGOPI_CHOOSE_MODE__(mode);
        else await window.webkit.messageHandlers.yugoChooseMode.postMessage(mode);
      } catch {
        document.getElementById('error').hidden = false;
      } finally {
        for (const item of buttons) item.disabled = false;
      }
    });
  }
</script>
</html>
