<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>YuGo Pi</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: 0.7; font-size: 14px; line-height: 1.6; }
      button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>无法连接 YuGo Pi</h1>
      <p>请检查网络后重试。Unable to reach the YuGo Pi client; check your network and retry.</p>
      <button id="retry" type="button">重试 Retry</button>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('retry') || 'https://yinniora.github.io/';
      document.getElementById('retry').onclick = () => location.replace(target);
      addEventListener('online', () => location.replace(target));
    </script>
  </body>
</html>
